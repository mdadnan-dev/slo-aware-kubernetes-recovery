<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="650" viewBox="0 0 1050 650">
<rect width="100%" height="100%" fill="white"/>
<text x="525.0" y="42" text-anchor="middle" font-family="Times New Roman,serif" font-size="27" font-weight="bold">Exploratory Three-Arm Recovery Comparison</text>
