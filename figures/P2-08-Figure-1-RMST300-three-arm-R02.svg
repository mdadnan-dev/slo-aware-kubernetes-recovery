<text x="111" y="432.8" text-anchor="end" font-family="Arial,sans-serif" font-size="15">50</text>
<line x1="125" y1="360.7" x2="980" y2="360.7" stroke="#D8D8D8"/>
<text x="111" y="365.7" text-anchor="end" font-family="Arial,sans-serif" font-size="15">100</text>
<line x1="125" y1="293.5" x2="980" y2="293.5" stroke="#D8D8D8"/>
<text x="111" y="298.5" text-anchor="end" font-family="Arial,sans-serif" font-size="15">150</text>
<line x1="125" y1="226.3" x2="980" y2="226.3" stroke="#D8D8D8"/>
<text x="111" y="231.3" text-anchor="end" font-family="Arial,sans-serif" font-size="15">200</text>
<line x1="125" y1="159.2" x2="980" y2="159.2" stroke="#D8D8D8"/>
<text x="111" y="164.2" text-anchor="end" font-family="Arial,sans-serif" font-size="15">250</text>
<line x1="125" y1="92.0" x2="980" y2="92.0" stroke="#D8D8D8"/>
<text x="111" y="97.0" text-anchor="end" font-family="Arial,sans-serif" font-size="15">300</text>
<rect x="225" y="137.9" width="145" height="357.1" rx="2" fill="#2F7FB8" stroke="#222" stroke-width="1.4"/>
<text x="297.5" y="123.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="bold">265.811 s</text>
<text x="297.5" y="529" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold">C2</text>
<text x="297.5" y="553" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">2 recovered, 1 censored</text>
<rect x="495" y="127.7" width="145" height="367.3" rx="2" fill="#D62728" stroke="#222" stroke-width="1.4"/>
<text x="567.5" y="113.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="bold">273.432 s</text>
<text x="567.5" y="529" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold">C5</text>
<text x="567.5" y="553" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">2 recovered, 1 censored</text>
<rect x="765" y="135.4" width="145" height="359.6" rx="2" fill="#2CA02C" stroke="#222" stroke-width="1.4"/>
<text x="837.5" y="121.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="bold">267.698 s</text>
<text x="837.5" y="529" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold">PREWARM</text>
<text x="837.5" y="553" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">2 recovered, 1 censored</text>
<text x="32" y="293.5" transform="rotate(-90 32 293.5)" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">KM RMST through 300 s (seconds; lower is faster)</text>
<text x="525.0" y="570" text-anchor="middle" font-family="Arial,sans-serif" font-size="15">C5 - C2 = +7.621 s; PREWARM - C2 = +1.887 s; PREWARM - C5 = -5.734 s</text>
<text x="525.0" y="602" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Three randomized blocks; exploratory analysis. No superiority claim supported; equivalence was not tested.</text>
