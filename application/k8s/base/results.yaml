apiVersion: apps/v1
kind: Deployment
metadata:
  name: results
  namespace: net470-v3
  labels:
    app.kubernetes.io/name: results
    app.kubernetes.io/component: result-store
    app.kubernetes.io/part-of: net470-v3
    app.kubernetes.io/version: q1
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: results
      app.kubernetes.io/part-of: net470-v3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: results
        app.kubernetes.io/component: result-store
        app.kubernetes.io/part-of: net470-v3
        app.kubernetes.io/version: q1
        net470.depaul.edu/resource-class: qualification-provisional
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: results
          image: net470-v3-results:q1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: net470-v3-config
          env:
            - name: IMAGE_VERSION
              value: q1
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 192Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: results
  namespace: net470-v3
  labels:
    app.kubernetes.io/name: results
    app.kubernetes.io/part-of: net470-v3
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: results
    app.kubernetes.io/part-of: net470-v3
  ports:
    - name: http
      port: 8000
      targetPort: http

